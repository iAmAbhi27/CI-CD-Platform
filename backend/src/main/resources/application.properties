spring.application.name=platform

# Database (env vars match .env; defaults match our local Docker Postgres)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:cicd}
spring.datasource.username=${POSTGRES_USER:cicd}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate

# Show db status details in /actuator/health (development)
management.endpoint.health.show-components=always
